version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: teremka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teremka
      POSTGRES_USER: teremka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teremka"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teremka_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://teremka:${DB_PASSWORD}@db:5432/teremka
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      DADATA_TOKEN: ${DADATA_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-/rost}
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    container_name: teremka_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  db_data:
  uploads_data:
